<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Digital Humanities Project — Network</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
</head>
<body data-page="network">
<header>
  <div class="header-row">
    <div>
      <h1>Digital Humanities Project</h1>
      <p class="members">
        NAME 1 — ID 1<br>
        NAME 2 — ID 2<br>
        NAME 3 — ID 3
      </p>
    </div>
    <nav><a class="active" href="index.html">Network</a><a href="graphs.html">Graphs</a></nav>
  </div>
</header>
<main>
  <div class="controls">
    <label>Region
      <select id="regionFilter">
        <option value="all">All</option><option>Metropolitan</option><option>Large city</option><option>Small town</option><option>Rural</option>
      </select>
    </label>
    <label>Academic year
      <select id="yearFilter"><option value="all">All</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select>
    </label>
    <label>Spending score
      <select id="spendFilter"><option value="all">All</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select>
    </label>
    <button id="resetFilters">Reset</button>
    <div class="meta"><span id="visibleCount">0</span> students shown</div>
  </div>
  <div class="network-wrap">
    <div id="networkViz"></div>
    <div id="tooltip" class="tooltip"></div>
  </div>
  <div class="legend">
    <span><i class="swatch" style="background:#3f6f9f"></i>Metropolitan</span>
    <span><i class="swatch" style="background:#5e8a70"></i>Large city</span>
    <span><i class="swatch" style="background:#b47745"></i>Small town</span>
    <span><i class="swatch" style="background:#786a91"></i>Rural</span>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
